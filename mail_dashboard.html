<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 메일 인텔리전스 대시보드 | GPT-6 Luna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: rgba(18, 24, 38, 0.75);
            --bg-card-hover: rgba(28, 36, 56, 0.92);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.35);
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(236, 72, 153, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.06) 0%, transparent 60%);
            background-attachment: fixed;
            padding-bottom: 70px;
        }

        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 30px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            margin-bottom: 28px;
            animation: fadeInDown 0.6s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 24px var(--primary-glow);
        }

        h1 {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-excel {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .btn-excel:hover {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        .badge-model {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.35);
            color: var(--primary-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* KPI Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .metric-card {
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-glow);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.15);
        }

        .metric-icon-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .metric-info h3 {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-info .metric-value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Visual Analytics Charts Section */
        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .chart-box {
            padding: 22px 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 290px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-canvas-wrap {
            position: relative;
            height: 210px;
            width: 100%;
        }

        /* Controls: Filter & Search */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 24px;
            margin-bottom: 24px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary-light);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .search-box {
            position: relative;
            min-width: 300px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 14px;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 9px 16px 9px 38px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Email Cards Grid */
        .email-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
            gap: 22px;
        }

        .email-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
        }

        .email-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
            background: var(--bg-card-hover);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .badges-wrap {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .tag-folder {
            background: rgba(255, 255, 255, 0.07);
            color: #cbd5e1;
            border: 1px solid var(--border-glass);
        }

        .tag-category {
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .tag-priority-긴급 {
            background: rgba(239, 68, 68, 0.18);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .tag-priority-높음 {
            background: rgba(245, 158, 11, 0.18);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .tag-priority-보통 {
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .tag-priority-낮음 {
            background: rgba(148, 163, 184, 0.18);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }

        .received-time {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .email-subject {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .email-sender {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* Summary Box */
        .summary-box {
            background: rgba(15, 23, 42, 0.5);
            border-left: 3px solid var(--primary);
            border-radius: 4px 8px 8px 4px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .summary-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-text {
            font-size: 13px;
            line-height: 1.55;
            color: #e2e8f0;
        }

        /* Action Items with Checklist */
        .action-items-box {
            margin-top: 12px;
            border-top: 1px solid var(--border-glass);
            padding-top: 14px;
        }

        .action-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .action-item {
            font-size: 12px;
            color: #cbd5e1;
            display: flex;
            align-items: flex-start;
            gap: 9px;
            background: rgba(255, 255, 255, 0.02);
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .action-checkbox {
            margin-top: 2px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .action-item.done span {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        /* Card Footer */
        .card-footer {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-dim);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
        }

        @media (max-width: 900px) {
            .analytics-grid { grid-template-columns: 1fr; }
            .header-actions { flex-direction: column; align-items: flex-start; }
            .email-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-left">
                <div class="logo-icon">
                    <i class="fa-solid fa-envelope-open-text" style="color: #ffffff;"></i>
                </div>
                <div>
                    <h1>AI 메일 인텔리전스 대시보드</h1>
                    <div class="subtitle">AI 자동 요약, 카테고리 분류 및 실시간 액션 아이템 대시보드</div>
                </div>
            </div>
            <div class="header-actions">
                <a href="email_summary_report.xlsx" class="btn-excel" download>

                <div class="badge-model">

        <!-- KPI Metrics Grid -->
        <div class="metrics-grid">

                </div>

                </div>

            <div class="metric-card glass">
                <div class="metric-icon-box" style="background: rgba(239, 68, 68, 0.15); color: #f87171;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="metric-info">
                    <h3>긴급/중요 메일</h3>
                    <div class="metric-value" style="color: #f87171;" id="urgent-mails">2건</div>
                </div>
            </div>

            <div class="metric-card glass">
                <div class="metric-icon-box" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div class="metric-info">
                    <h3>도출된 실행 과제</h3>

                </div>
            </div>

            <div class="metric-card glass">
                <div class="metric-icon-box" style="background: rgba(245, 158, 11, 0.15); color: #fbbf24;">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="metric-info">
                    <h3>업무 요청 비율</h3>
                    <div class="metric-value" style="color: #fbbf24;" id="work-req">50%</div>
                </div>
            </div>
        </div>

        <!-- Visual Analytics Chart Section -->
        <div class="analytics-grid">
            <div class="chart-box glass">
                <div class="chart-title">
                    <i class="fa-solid fa-chart-pie" style="color: var(--primary-light);"></i>
                    <span>카테고리별 메일 분포</span>
                </div>
                <div class="chart-canvas-wrap">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="chart-box glass">
                <div class="chart-title">
                    <i class="fa-solid fa-chart-simple" style="color: #34d399;"></i>
                    <span>중요도 및 우선순위 분석</span>
                </div>
                <div class="chart-canvas-wrap">
                    <canvas id="priorityChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Filter & Search Controls -->
        <div class="controls-bar glass">
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterCategory('전체', this)">전체 메일</button>
                <button class="filter-btn" onclick="filterCategory('업무 요청', this)">업무 요청</button>
                <button class="filter-btn" onclick="filterCategory('회의 및 미팅', this)">회의/미팅</button>
                <button class="filter-btn" onclick="filterCategory('공지 및 안내', this)">공지사항</button>
                <button class="filter-btn" onclick="filterCategory('보고서 및 제안', this)">보고/제안</button>
                <button class="filter-btn" onclick="filterPriority('긴급', this)">긴급/높음만</button>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="search-input" placeholder="제목, 발신자, 핵심 요약 검색..." oninput="handleSearch()">
            </div>
        </div>

        <!-- Email Cards Grid -->
        <div class="email-grid" id="email-grid"></div>
    </div>

            {

                sender: "나 -> 최정민 CHOI JUNG MIN; 김성중 KIM SUNG JOONG", received_time: "2026-07-28 13:40:50.159000+00:00",
                body: "비교 자료: y=0.9965x+1.9353, R=0.9944 (Whole blood K2 EDTA). APSP 저농도 허용오차와 EFLM 3.2% 기준 일치 여부 의문.",
                ai_analysis: {
                    category: "업무 요청", priority: "보통",
                    summary: "비교 자료 전달. APSP 저농도 허용오차(15ng/ml=0.5ng/ml=3.33%)와 EFLM 3.2% 기준 일치 여부 의문 제기.",
                    action_items: ["비교 자료 및 회귀 결과 검토", "APSP 저농도 허용오차와 EFLM 3.2% 기준 적용 타당성 확인"],

        ];

        // ==================== 상태 관리 ====================
        let currentCategory = '전체';
        let currentPriorityFilter = false;
        let searchQuery = '';

        // ==================== 데이터 처리 ====================
        function getActionState(id, idx) {
            const key = `${STORAGE_KEY}_${id}_${idx}`;
            return localStorage.getItem(key) === 'true';
        }

        function toggleAction(id, idx, checkbox) {
            const isDone = checkbox.checked;
            localStorage.setItem(`${STORAGE_KEY}_${id}_${idx}`, isDone ? 'true' : 'false');
            const parent = checkbox.closest('.action-item');
            if (isDone) parent.classList.add('done');
            else parent.classList.remove('done');
            updateMetrics();
        }

        // ==================== 렌더링 ====================
        function renderCards(data) {
            const container = document.getElementById('email-grid');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open" style="font-size: 40px; margin-bottom: 12px;"></i>
                        <p>조건에 일치하는 메일이 없습니다.</p>
                    </div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const ai = item.ai_analysis || {};
                const priorityClass = `tag-priority-${ai.priority || '보통'}`;

                const actionHtml = (ai.action_items && ai.action_items.length > 0 && ai.action_items[0] !== '해당 없음')
                    ? `
                    <div class="action-items-box">
                        <div class="action-title"><i class="fa-solid fa-clipboard-check"></i> 주요 실행 과제 (To-Do)</div>
                        <ul class="action-list">
                            ${ai.action_items.map((act, aIdx) => {
                                const isDone = getActionState(item.id, aIdx);
                                return `
                                    <li class="action-item ${isDone ? 'done' : ''}">
                                        <input type="checkbox" class="action-checkbox" ${isDone ? 'checked' : ''} onchange="toggleAction(${item.id}, ${aIdx}, this)">
                                        <span>${act}</span>
                                    </li>`;
                            }).join('')}
                        </ul>
                    </div>`
                    : '';

                return `
                    <div class="email-card glass">
                        <div>
                            <div class="card-top">
                                <div class="badges-wrap">
                                    <span class="tag tag-folder">${item.folder || '받은 편지함'}</span>
                                    <span class="tag tag-category">${ai.category || '일반'}</span>
                                    <span class="tag ${priorityClass}">${ai.priority || '보통'}</span>
                                </div>
                                <span class="received-time"><i class="fa-regular fa-calendar"></i> ${str(item.received_time).slice(0, 16)}</span>
                            </div>

                            <h2 class="email-subject">${item.subject}</h2>
                            <div class="email-sender">
                                <i class="fa-regular fa-user" style="color: var(--primary-light);"></i>
                                <span>${item.sender}</span>
                            </div>

                            <div class="summary-box">
                                <div class="summary-label"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 핵심 요약</div>
                                <div class="summary-text">${ai.summary || '요약 내용이 없습니다.'}</div>
                            </div>

                            ${actionHtml}
                        </div>

                        <div class="card-footer">
                            <span><i class="fa-solid fa-database"></i> ${item.source || 'Outlook'}</span>
                            <span><i class="fa-solid fa-bolt"></i> ${ai.urgency || '일반'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==================== 필터링 ====================
        function filterCategory(cat, btn) {
            currentCategory = cat;
            currentPriorityFilter = false;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            applyFilters();
        }

        function filterPriority(pri, btn) {
            currentPriorityFilter = true;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            applyFilters();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            applyFilters();
        }

        function applyFilters() {
            const filtered = emailsData.filter(item => {
                const ai = item.ai_analysis || {};
                let matchCategory = true;
                if (currentPriorityFilter) {
                    matchCategory = ['긴급', '높음'].includes(ai.priority);
                } else if (currentCategory !== '전체') {
                    matchCategory = (ai.category && ai.category.includes(currentCategory));
                }

                const searchTarget = `${item.subject} ${item.sender} ${ai.summary || ''} ${(ai.action_items || []).join(' ')}`.toLowerCase();
                const matchSearch = !searchQuery || searchTarget.includes(searchQuery);

                return matchCategory && matchSearch;
            });
            renderCards(filtered);
            updateMetrics();
            updateCharts(filtered);
        }

        function str(val) { return val ? String(val) : ''; }

        // ==================== 차트 ====================
        function updateCharts(filteredData) {
            const catCounts = {};
            const priCounts = { '긴급': 0, '높음': 0, '보통': 0, '낮음': 0 };

            filteredData.forEach(e => {
                const c = (e.ai_analysis && e.ai_analysis.category) || '기타';
                catCounts[c] = (catCounts[c] || 0) + 1;
                const p = (e.ai_analysis && e.ai_analysis.priority) || '보통';
                if (priCounts[p] !== undefined) priCounts[p]++;
                else priCounts['보통']++;
            });

            // 카테고리 도넛 차트
            new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catCounts),
                    datasets: [{
                        data: Object.values(catCounts),
                        backgroundColor: [CHART_COLORS.primary, CHART_COLORS.purple, CHART_COLORS.pink, CHART_COLORS.blue, CHART_COLORS.green, CHART_COLORS.yellow],
                        borderColor: '#0b0f19',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#cbd5e1', font: { size: 11 } } }
                    }
                }
            });

            // 중요도 바 차트
            new Chart(document.getElementById('priorityChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(priCounts),
                    datasets: [{
                        label: '메일 수',
                        data: Object.values(priCounts),
                        backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#94a3b8'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#cbd5e1' }, grid: { display: false } }
                    }
                }
            });
        }

        // ==================== 메트릭 업데이트 ====================
        function updateMetrics() {
            const allData = emailsData;
            const filtered = allData.filter(item => {
                const ai = item.ai_analysis || {};
                return true;
            });

            document.getElementById('total-mails').textContent = filtered.length + '건';

            const urgent = filtered.filter(e => ['긴급', '높음'].includes((e.ai_analysis && e.ai_analysis.priority) || '보통')).length;
            document.getElementById('urgent-mails').textContent = urgent + '건';

            const totalActions = allData.reduce((sum, e) => {
                const ai = e.ai_analysis || {};
                return sum + (ai.action_items || []).filter(a => a !== '해당 없음').length;
            }, 0);
            document.getElementById('action-items').textContent = totalActions + '건';

            const workReq = allData.filter(e => (e.ai_analysis && e.ai_analysis.category === '업무 요청')).length;
            document.getElementById('work-req').textContent = Math.round(workReq / allData.length * 100) + '%';
        }

        // ==================== 초기화 ====================
        renderCards(emailsData);
        updateCharts(emailsData);
        updateMetrics();
    </script>
